name: build-installer

# Builds a GCC-linked Talos installer image + USB ISO for T2 Intel Macs.
# Installer image -> ghcr.io/<owner>/talos-mac/installer:<version>
# ISO             -> attached to a GitHub Release named after the version.

on:
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Override TALOS_VERSION (else versions.env)"
        required: false
        type: string
  push:
    paths: [versions.env, profile.yaml.tmpl, scripts/**, .github/workflows/build-installer.yaml]

permissions:
  contents: write   # create releases / upload ISO
  packages: write   # push images to GHCR

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kernel build + Talos artifacts blow past the stock 14GB runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Load versions.env
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"
          if [ -n "${{ inputs.talos_version }}" ]; then
            sed -i '/^TALOS_VERSION=/d' "$GITHUB_ENV"
            echo "TALOS_VERSION=${{ inputs.talos_version }}" >> "$GITHUB_ENV"
          fi

      - name: Set registry
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/talos-mac" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          chmod +x scripts/*.sh
          scripts/build.sh

      - name: Upload ISO to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TALOS_VERSION }}
          name: Talos ${{ env.TALOS_VERSION }} (T2 Mac, GCC kernel)
          files: _out/*.iso
          fail_on_unmatched_files: true
          body: |
            GCC-linked Talos ${{ env.TALOS_VERSION }} for 2018 T2 Intel Macs (issue #13579).
            Installer image: `${{ env.REGISTRY }}/installer:${{ env.TALOS_VERSION }}`
